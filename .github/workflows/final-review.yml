name: Final AI review

# Reusable single-PR final review. Call it from a workflow in the consuming
# repository that listens to pull_request_target and issue_comment; see
# README.md for the caller template, which also owns the event-level
# concurrency that cancels obsolete runs.
on:
  workflow_call:
    secrets:
      MISTRAL_API_KEY:
        required: true

jobs:
  trusted_policy:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/final-review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted_sha: ${{ steps.resolve.outputs.trusted_sha }}
      host_sha: ${{ steps.host.outputs.sha }}
    steps:
      - name: Record pinned review implementation
        id: host
        env:
          HOST_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${HOST_SHA}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${HOST_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Resolve trusted default-branch commit
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const workflowSha = process.env.GITHUB_WORKFLOW_SHA
            if (!/^[0-9a-f]{40}$/.test(workflowSha ?? '')) {
              core.setFailed('Workflow definition commit is missing')
              return
            }
            const response = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: workflowSha,
            })
            const sha = response.data?.sha
            if (sha !== workflowSha) {
              core.setFailed('Workflow definition commit could not be verified')
              return
            }
            core.setOutput('trusted_sha', workflowSha)

  resolve_lock:
    needs: trusted_policy
    if: >-
      needs.trusted_policy.result == 'success' &&
      github.event_name == 'pull_request_target'
    env:
      OCR_HOST_SHA: ${{ needs.trusted_policy.outputs.host_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lock_key: ${{ steps.resolve.outputs.lock_key }}
    steps:
      - name: Checkout pinned final-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.trusted_policy.outputs.host_sha }}
          path: .ocr-review
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/open-code-review

      - name: Resolve status-lock identity
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.ocr-review/.github/scripts/final-ai-review.js')
            const lockKey = await helper.resolveFinalReviewLockKey({
              github,
              context,
              pullNumber: context.payload.pull_request.number,
              pull: context.payload.pull_request,
            })
            core.setOutput('lock_key', lockKey)

  initialize:
    needs: [trusted_policy, resolve_lock]
    if: >-
      needs.trusted_policy.result == 'success' &&
      needs.resolve_lock.result == 'success' &&
      github.event_name == 'pull_request_target'
    env:
      OCR_HOST_SHA: ${{ needs.trusted_policy.outputs.host_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: final-ai-status-lock-${{ needs.resolve_lock.outputs.lock_key }}
      cancel-in-progress: false
      queue: max
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout pinned final-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.trusted_policy.outputs.host_sha }}
          path: .ocr-review
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/open-code-review

      - name: Initialize final-review status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.ocr-review/.github/scripts/final-ai-review.js')
            await helper.initializeFinalReview({
              github,
              context,
              core,
            })

  authorize:
    needs: trusted_policy
    if: >-
      needs.trusted_policy.result == 'success' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/final-review'
    env:
      OCR_HOST_SHA: ${{ needs.trusted_policy.outputs.host_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      issues: read
      pull-requests: read
      statuses: read
      actions: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      base_sha: ${{ steps.authorize.outputs.base_sha }}
      head_sha: ${{ steps.authorize.outputs.head_sha }}
      trusted_sha: ${{ steps.authorize.outputs.trusted_sha }}
      mode: ${{ steps.authorize.outputs.mode }}
      root_head: ${{ steps.authorize.outputs.root_head }}
      root_review_id: ${{ steps.authorize.outputs.root_review_id }}
      policy_digest: ${{ steps.authorize.outputs.policy_digest }}
      background_digest: ${{ steps.authorize.outputs.background_digest }}
      scope_kind: ${{ steps.authorize.outputs.scope_kind }}
      stack_id: ${{ steps.authorize.outputs.stack_id }}
      stack_position: ${{ steps.authorize.outputs.stack_position }}
      stack_order_digest: ${{ steps.authorize.outputs.stack_order_digest }}
      disposition_digest: ${{ steps.authorize.outputs.disposition_digest }}
      disposition_ids: ${{ steps.authorize.outputs.disposition_ids }}
      status_lock_key: ${{ steps.authorize.outputs.status_lock_key }}
      background: ${{ steps.authorize.outputs.background }}
    steps:
      - name: Checkout pinned final-review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.trusted_policy.outputs.host_sha }}
          path: .ocr-review
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/open-code-review

      - name: Authorize final review
        id: authorize
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRUSTED_SHA: ${{ needs.trusted_policy.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.ocr-review/.github/scripts/final-ai-review.js')
            await helper.authorizeFinalReview({
              github,
              context,
              core,
              trustedSha: process.env.TRUSTED_SHA,
            })

  start:
    needs: [trusted_policy, authorize]
    if: needs.authorize.outputs.authorized == 'true'
    env:
      OCR_HOST_SHA: ${{ needs.trusted_policy.outputs.host_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: final-ai-status-lock-${{ needs.authorize.outputs.status_lock_key }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: write
      actions: read
    outputs:
      run_review: ${{ steps.start.outputs.run_review }}
      background: ${{ steps.start.outputs.background }}
    steps:
      - name: Checkout pinned final-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.trusted_policy.outputs.host_sha }}
          path: .ocr-review
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/open-code-review

      - name: Start final review
        id: start
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize.outputs.root_review_id }}
          POLICY_DIGEST: ${{ needs.authorize.outputs.policy_digest }}
          BACKGROUND_DIGEST: ${{ needs.authorize.outputs.background_digest }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize.outputs.disposition_digest }}
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.ocr-review/.github/scripts/final-ai-review.js')
            const shouldRun = await helper.startFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              policyDigest: process.env.POLICY_DIGEST,
              backgroundDigest: process.env.BACKGROUND_DIGEST,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              trustedSha: process.env.TRUSTED_SHA,
              core,
            })
            core.setOutput('run_review', String(shouldRun))

  review:
    needs: [trusted_policy, authorize, start]
    env:
      OCR_NO_UPDATE: '1'
      OCR_LLM_TIMEOUT: '2700'
      OCR_HOST_SHA: ${{ needs.trusted_policy.outputs.host_sha }}
    if: >-
      needs.authorize.outputs.authorized == 'true' &&
      needs.start.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: final-ai-review-${{ needs.authorize.outputs.pr_number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: read
      pull-requests: write
      actions: read
    outputs:
      review_outcome: ${{ steps.run_review.outcome }}
      cleanup_outcome: ${{ steps.cleanup.outcome }}
      publish_outcome: ${{ steps.publish.outcome }}
      clean_review: ${{ steps.publish.outputs.clean_review }}
    steps:
      - name: Record review job start
        id: job_start
        run: echo "epoch=$(date +%s)" >>"${GITHUB_OUTPUT}"

      - name: Checkout trusted review policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.trusted_sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github/open-code-review

      - name: Checkout pinned final-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.trusted_policy.outputs.host_sha }}
          path: .ocr-review
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/open-code-review

      - name: Verify trusted policy and implementation
        env:
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
          HOST_SHA: ${{ needs.trusted_policy.outputs.host_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${TRUSTED_SHA}"
          test "$(git -C .ocr-review rev-parse HEAD)" = "${HOST_SHA}"

      - name: Resolve immutable review range
        id: range
        if: needs.start.outputs.run_review == 'true'
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${REVIEW_MODE}" == "full" || "${REVIEW_MODE}" == "incremental" ]]
          [[ "${ROOT_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${HEAD_SHA}"
          if [[ "${REVIEW_MODE}" == "incremental" ]]; then
            REVIEW_FROM="${ROOT_HEAD}"
          else
            git cat-file -e "${BASE_SHA}^{commit}"
            REVIEW_FROM="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          git cat-file -e "${REVIEW_FROM}^{commit}"
          [[ "${REVIEW_FROM}" =~ ^[0-9a-f]{40}$ ]]
          echo "review_from=${REVIEW_FROM}" >>"${GITHUB_OUTPUT}"
          # Plan context covers the whole pull request, also in incremental mode.
          PLAN_FROM="${REVIEW_FROM}"
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            PLAN_FROM="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}")"
          fi
          echo "plan_from=${PLAN_FROM}" >>"${GITHUB_OUTPUT}"

      - name: Install pinned OpenCodeReview CLI
        if: needs.start.outputs.run_review == 'true'
        run: |
          npm install -g @alibaba-group/open-code-review@1.13.0
          ocr version

      - name: Build review rules
        if: needs.start.outputs.run_review == 'true'
        run: node .ocr-review/.github/scripts/final-ai-review.js build-rules "${RUNNER_TEMP}/final-review-rules.json"

      - name: Configure ephemeral Mistral access
        id: configure
        if: needs.start.outputs.run_review == 'true'
        run: |
          set -euo pipefail
          node .ocr-review/.github/scripts/final-ai-review.js configure-ocr
          test -s "${HOME}/.opencodereview/config.json"

      - name: Verify Mistral tool access
        id: preflight
        if: needs.start.outputs.run_review == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OCR_ADAPTER_DIAGNOSTICS_PATH: ${{ runner.temp }}/final-ai-review-adapter-diagnostics.jsonl
        run: |
          set -euo pipefail
          node .ocr-review/.github/scripts/final-ai-review.js verify-mistral-tools

      - name: Run final review
        id: run_review
        if: needs.start.outputs.run_review == 'true'
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          BACKGROUND: ${{ needs.start.outputs.background }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_FROM: ${{ steps.range.outputs.review_from }}
          PLAN_FROM: ${{ steps.range.outputs.plan_from }}
          REVIEW_JOB_STARTED_AT: ${{ steps.job_start.outputs.epoch }}
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
          RULES_PATH: ${{ runner.temp }}/final-review-rules.json
          REJECTED_DIR: ${{ runner.temp }}/final-ai-individual-publisher-failure
          STDERR_PATH: ${{ runner.temp }}/final-ai-review-stderr.log
          OCR_ADAPTER_DIAGNOSTICS_PATH: ${{ runner.temp }}/final-ai-review-adapter-diagnostics.jsonl
        run: |
          set -euo pipefail
          run_ocr_attempt() {
            local output_path="$1"
            local token_budget="$2"
            local session_id="${3:-}"
            local resume_args=()
            local now
            local version
            local exit_code=0
            if version=$(
              unset MISTRAL_API_KEY
              ocr version 2>/dev/null
            ); then
              if [[ "${version}" != 'open-code-review v1.13.0 '* ]]; then
                exit_code=1
              fi
            else
              exit_code=$?
            fi
            if (( exit_code != 0 )); then
              printf 'OCR stage=version exit=%s\n' "${exit_code}" >>"${GITHUB_STEP_SUMMARY}"
              echo 'Pinned OCR executable verification failed; raw output is suppressed.' >&2
              return "${exit_code}"
            fi
            local prompt_limit=200000
            if ! (unset MISTRAL_API_KEY; timeout --kill-after=10 120 ocr review --preview \
              --from "${REVIEW_FROM}" --to "${HEAD_SHA}" \
              --max-tokens "${prompt_limit}" --format json --audience agent \
              --rule "${RULES_PATH}") \
              >"${output_path}.preview-${prompt_limit}" 2>>"${STDERR_PATH}"; then
              echo 'OCR coverage preview failed; raw output is suppressed.' >&2
              return 1
            fi
            if ! node .ocr-review/.github/scripts/final-ai-review.js validate-ocr-preview \
              "${output_path}.preview-${prompt_limit}" \
              >/dev/null 2>>"${STDERR_PATH}"; then
              printf 'OCR stage=preview-validation exit=1\n' >>"${GITHUB_STEP_SUMMARY}"
              echo 'OCR preview validation failed: malformed preview or oversized file exclusion; review refused.' >&2
              return 1
            fi
            [[ "${REVIEW_JOB_STARTED_AT}" =~ ^[1-9][0-9]*$ ]]
            now="$(date +%s)"
            if (( now + 2760 > REVIEW_JOB_STARTED_AT + 4800 )); then
              echo 'Refusing to start OCR without the reserved cleanup window' >&2
              return 1
            fi
            if [[ -n "${session_id}" ]]; then
              resume_args=(--resume "${session_id}")
            fi
            OCR_ADAPTER_LIFETIMES=$((OCR_ADAPTER_LIFETIMES + 1))
            printf 'adapter_lifetimes=%s\n' "${OCR_ADAPTER_LIFETIMES}" >>"${GITHUB_OUTPUT}"
            if OCR_ADAPTER_PROGRESS_FD=3 node .ocr-review/.github/scripts/ocr-mistral-adapter.cjs run --ocr-config "${HOME}/.opencodereview/config.json" -- ocr review \
              --from "${REVIEW_FROM}" \
              --to "${HEAD_SHA}" \
              --audience human \
              --effort low \
              --concurrency 2 \
              --timeout 45 \
              --max-tokens "${prompt_limit}" \
              --max-tokens-budget "${token_budget}" \
              --format json \
              --background "${BACKGROUND}" \
              --rule "${RULES_PATH}" \
              "${resume_args[@]}" \
              3>&2 >"${output_path}" 2>>"${STDERR_PATH}"; then
              exit_code=0
            else
              exit_code=$?
            fi
            printf 'OCR stage=review exit=%s stdout_bytes=%s stderr_total_bytes=%s\n' \
              "${exit_code}" "$(wc -c <"${output_path}")" "$(wc -c <"${STDERR_PATH}")" \
              >>"${GITHUB_STEP_SUMMARY}"
            if (( exit_code != 0 )); then
              node .ocr-review/.github/scripts/final-ai-review.js diagnose-ocr-failure \
                "${output_path}" >/dev/null || true
            fi
            return "${exit_code}"
          }

          [[ "${PLAN_FROM}" =~ ^[0-9a-f]{40}$ ]]
          PLAN_CONTEXT="$(node .ocr-review/.github/scripts/final-ai-review.js plan-context \
            "${PLAN_FROM}" "${HEAD_SHA}")"
          if [[ -n "${PLAN_CONTEXT}" ]]; then
            BACKGROUND+=$'\n'"${PLAN_CONTEXT}"
          fi
          : >"${STDERR_PATH}"
          OCR_ADAPTER_LIFETIMES=0
          run_ocr_attempt "${RESULT_PATH}" 10000000
          RESUME_PLAN_PATH="${RESULT_PATH}.resume-plan"
          if ! node .ocr-review/.github/scripts/final-ai-review.js plan-ocr-resume \
            "${RESULT_PATH}" 10000000 >"${RESUME_PLAN_PATH}"; then
            mkdir -p "${REJECTED_DIR}"
            cp -- "${RESULT_PATH}" "${REJECTED_DIR}/initial-result.json"
            echo 'validation_failure=true' >>"${GITHUB_OUTPUT}"
            exit 1
          fi
          mapfile -t RESUME_PLAN <"${RESUME_PLAN_PATH}"
          if (( ${#RESUME_PLAN[@]} > 0 )); then
            (( ${#RESUME_PLAN[@]} == 2 ))
            SESSION_ID="${RESUME_PLAN[0]}"
            REMAINING_TOKENS="${RESUME_PLAN[1]}"
            [[ "${SESSION_ID}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$ ]]
            [[ "${REMAINING_TOKENS}" =~ ^[1-9][0-9]*$ ]]
            RESUMED_PATH="${RESULT_PATH}.resumed"
            MERGED_PATH="${RESULT_PATH}.merged"
            run_ocr_attempt \
              "${RESUMED_PATH}" "${REMAINING_TOKENS}" "${SESSION_ID}"
            if ! node .ocr-review/.github/scripts/final-ai-review.js merge-ocr-resume \
              "${RESULT_PATH}" "${RESUMED_PATH}" 10000000 >"${MERGED_PATH}"; then
              mkdir -p "${REJECTED_DIR}"
              cp -- "${RESULT_PATH}" "${REJECTED_DIR}/initial-result.json"
              cp -- "${RESUMED_PATH}" "${REJECTED_DIR}/resumed-result.json"
              echo 'validation_failure=true' >>"${GITHUB_OUTPUT}"
              exit 1
            fi
            mv "${MERGED_PATH}" "${RESULT_PATH}"
          fi

      - name: Validate final review OCR result
        id: validate_result
        if: steps.run_review.outcome == 'success'
        env:
          REJECTED_DIR: ${{ runner.temp }}/final-ai-individual-publisher-failure
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
        run: |
          set -euo pipefail
          if ! node .ocr-review/.github/scripts/final-ai-review.js validate-ocr-result "${RESULT_PATH}"; then
            mkdir -p "${REJECTED_DIR}"
            cp -- "${RESULT_PATH}" "${REJECTED_DIR}/result.json"
            exit 1
          fi

      - name: Summarize final review failure output
        if: failure() && steps.run_review.outcome == 'failure'
        run: |
          set -euo pipefail
          echo 'Final review execution failed; raw provider and result output is suppressed.'
          {
            echo '### Final review CLI failure'
            echo
            echo 'Raw provider and result output is suppressed.'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Summarize rejected final review result
        if: failure() && steps.validate_result.outcome == 'failure'
        run: |
          set -euo pipefail
          echo 'Final review result validation failed; the rejected input is retained as a restricted artifact.'
          {
            echo '### Final review result validation failed'
            echo
            echo 'The rejected input is retained as a restricted one-day artifact.'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove ephemeral Mistral access
        id: cleanup
        if: always() && needs.start.outputs.run_review == 'true'
        run: node .ocr-review/.github/scripts/final-ai-review.js cleanup-ocr

      - name: Publish consolidated final review
        id: publish
        if: >-
          steps.run_review.outcome == 'success' &&
          steps.validate_result.outcome == 'success' &&
          steps.cleanup.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize.outputs.root_review_id }}
          POLICY_DIGEST: ${{ needs.authorize.outputs.policy_digest }}
          BACKGROUND_DIGEST: ${{ needs.authorize.outputs.background_digest }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize.outputs.disposition_digest }}
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.ocr-review/.github/scripts/final-ai-review.js')
            const url = await helper.publishFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              policyDigest: process.env.POLICY_DIGEST,
              backgroundDigest: process.env.BACKGROUND_DIGEST,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              trustedSha: process.env.TRUSTED_SHA,
              workflowSha: process.env.GITHUB_WORKFLOW_SHA,
              resultPath: process.env.RESULT_PATH,
            })
            core.setOutput('clean_review', String(url == null))
            core.info(
              url
                ? `Published ${url}`
                : 'No actionable findings; skipped the pull-request comment'
            )

      - name: Stage rejected individual publisher input
        if: >-
          failure() &&
          (steps.run_review.outputs.validation_failure == 'true' ||
          steps.validate_result.outcome == 'failure' ||
          steps.publish.outcome == 'failure')
        env:
          REJECTED_DIR: ${{ runner.temp }}/final-ai-individual-publisher-failure
          RESULT_PATH: ${{ runner.temp }}/final-ai-review-result.json
        run: |
          set -euo pipefail
          mkdir -p "${REJECTED_DIR}"
          if [[ ! -e "${REJECTED_DIR}/result.json" && -f "${RESULT_PATH}" ]]; then
            cp -- "${RESULT_PATH}" "${REJECTED_DIR}/result.json"
          fi

      - name: Upload rejected individual publisher input
        if: >-
          failure() &&
          (steps.run_review.outputs.validation_failure == 'true' ||
          steps.validate_result.outcome == 'failure' ||
          steps.publish.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-ai-individual-publisher-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-ai-individual-publisher-failure
          if-no-files-found: error
          retention-days: 1

      - name: Upload sanitized individual execution counters
        if: always() && needs.start.outputs.run_review == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-ai-individual-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final-ai-review-adapter-diagnostics.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Summarize OCR estimated cost and caching savings
        if: always() && needs.start.outputs.run_review == 'true'
        continue-on-error: true
        env:
          DIAGNOSTICS_PATH: ${{ runner.temp }}/final-ai-review-adapter-diagnostics.jsonl
          PREFLIGHT_RECEIPTS: ${{ steps.preflight.outcome == 'skipped' && '0' || '1' }}
          ADAPTER_RECEIPTS: ${{ steps.run_review.outputs.adapter_lifetimes || '0' }}
        run: >-
          node .ocr-review/.github/scripts/ocr-mistral-adapter.cjs summary "${DIAGNOSTICS_PATH}"
          "preflight=${PREFLIGHT_RECEIPTS}" "adapter=${ADAPTER_RECEIPTS}"

  finalize:
    needs: [trusted_policy, authorize, start, review]
    if: >-
      always() &&
      needs.authorize.outputs.authorized == 'true' &&
      (needs.start.outputs.run_review == 'true' || needs.start.result == 'failure')
    env:
      OCR_HOST_SHA: ${{ needs.trusted_policy.outputs.host_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: final-ai-status-lock-${{ needs.authorize.outputs.status_lock_key }}
      cancel-in-progress: false
      queue: max
    permissions:
      checks: write
      contents: read
      pull-requests: read
      statuses: write
      actions: read
    steps:
      - name: Checkout pinned final-review implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ needs.trusted_policy.outputs.host_sha }}
          path: .ocr-review
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/open-code-review

      - name: Finalize exact-head status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          REVIEW_MODE: ${{ needs.authorize.outputs.mode }}
          ROOT_HEAD: ${{ needs.authorize.outputs.root_head }}
          ROOT_REVIEW_ID: ${{ needs.authorize.outputs.root_review_id }}
          BACKGROUND_DIGEST: ${{ needs.authorize.outputs.background_digest }}
          SCOPE_KIND: ${{ needs.authorize.outputs.scope_kind }}
          STACK_ID: ${{ needs.authorize.outputs.stack_id }}
          STACK_POSITION: ${{ needs.authorize.outputs.stack_position }}
          STACK_ORDER_DIGEST: ${{ needs.authorize.outputs.stack_order_digest }}
          DISPOSITION_DIGEST: ${{ needs.authorize.outputs.disposition_digest }}
          DISPOSITION_IDS: ${{ needs.authorize.outputs.disposition_ids }}
          REVIEW_OUTCOME: ${{ needs.review.outputs.review_outcome || needs.review.result }}
          CLEANUP_OUTCOME: ${{ needs.review.outputs.cleanup_outcome || needs.review.result }}
          PUBLISH_OUTCOME: ${{ needs.review.outputs.publish_outcome || needs.review.result }}
          CLEAN_REVIEW: ${{ needs.review.outputs.clean_review || 'false' }}
          POLICY_DIGEST: ${{ needs.authorize.outputs.policy_digest }}
          TRUSTED_SHA: ${{ needs.authorize.outputs.trusted_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.ocr-review/.github/scripts/final-ai-review.js')
            await helper.finalizeFinalReview({
              github,
              context,
              prNumber: Number(process.env.PR_NUMBER),
              baseSha: process.env.BASE_SHA,
              headSha: process.env.HEAD_SHA,
              mode: process.env.REVIEW_MODE,
              rootHead: process.env.ROOT_HEAD,
              rootReviewId: process.env.ROOT_REVIEW_ID,
              backgroundDigest: process.env.BACKGROUND_DIGEST,
              scopeKind: process.env.SCOPE_KIND,
              stackId: process.env.STACK_ID,
              stackPosition: process.env.STACK_POSITION,
              stackOrderDigest: process.env.STACK_ORDER_DIGEST,
              dispositionDigest: process.env.DISPOSITION_DIGEST,
              dispositionIds: JSON.parse(process.env.DISPOSITION_IDS || '[]'),
              reviewOutcome: process.env.REVIEW_OUTCOME,
              cleanupOutcome: process.env.CLEANUP_OUTCOME,
              publishOutcome: process.env.PUBLISH_OUTCOME,
              cleanReview: process.env.CLEAN_REVIEW,
              policyDigest: process.env.POLICY_DIGEST,
              trustedSha: process.env.TRUSTED_SHA,
            })

      - name: Finalize failure fallback
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const helper = require('./.ocr-review/.github/scripts/final-ai-review.js')
            await helper.finalizeFinalReviewFailure({
              github,
              context,
              headSha: process.env.HEAD_SHA,
            })
